[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "A personal assistant with a shared agent core and three faces: terminal, voice, and web."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.6.0",
    "pymongo>=4.6",
    "rich>=13.7",
]

[project.optional-dependencies]
voice = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "pyttsx3>=2.90",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "mongomock>=4.1",
    "pytest>=8.0",
    "ruff>=0.4",
]
all = [
    "jarvis[voice,web,dev]",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
