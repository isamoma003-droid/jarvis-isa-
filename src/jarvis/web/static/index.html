<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="mark">◈</span>
    <h1>JARVIS</h1>
  </div>
  <div class="meta">
    <span id="model">—</span>
    <span class="sep">·</span>
    <span id="workspace" title="workspace">—</span>
    <span class="sep">·</span>
    <span id="approval">—</span>
  </div>
  <div class="controls">
    <span id="status" class="status offline" title="connection"></span>
    <button id="reset" title="Start a fresh conversation">new</button>
  </div>
</header>

<main id="thread" aria-live="polite">
  <div class="empty" id="empty">
    <p class="empty-mark">◈</p>
    <p>Ask for something. Files, shell, the web, your memory, reminders — or hand a
       big job to a sub-agent and keep talking.</p>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask Jarvis…" autofocus></textarea>
    <button id="send" title="Send (Enter)">send</button>
    <button id="stop" class="hidden" title="Stop this turn">stop</button>
  </div>
  <p class="hint">Enter to send · Shift+Enter for a new line</p>
</footer>

<div id="approval" class="modal hidden">
  <div class="modal-card">
    <h2>Approval needed</h2>
    <p class="action" id="approval-action"></p>
    <pre class="detail" id="approval-detail"></pre>
    <div class="modal-actions">
      <button id="deny" class="ghost">deny</button>
      <button id="allow">allow</button>
    </div>
  </div>
</div>

<div id="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
